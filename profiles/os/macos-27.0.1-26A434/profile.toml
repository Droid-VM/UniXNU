["os"]
"name" = "macos-27.0.1-26A434"
"arch" = "arm64e"
"darwin" = "25.5.0"
# macOS 27.0.1 (26A434), the system macOS-DroidVM (Droid-VM/macOS-DroidVM) runs in DroidVM. No Darwin 26 XNU source is
# published yet: it runs on the same xnu-12377 kernel as iPadOS 27 (ipados-27.0.1-24A446) with the Darwin 26 system calls and
# KPIs added (the same four patches open patches/xnu/series), then the macOS layer -- the macOS KPIs, configuration and
# userland needs, every one under XNU_TARGET_OS_OSX where the file is also compiled for iPadOS.
"xnu_version" = "12377.121.6"
"xnu_revision" = "ac9718fb1af618d5ce8678d0dc6e8a58f252216f"
# 12377 carries iokit/DriverKit; EXTERNAL_HEADERS/TrustCache comes from the last tag that ships it.
"driverkit_tag" = "xnu-12377.121.6"
"trustcache_tag" = "xnu-8796.101.5"
# The kernel serves macOS userspace: XNU_TARGET_OS_OSX (the padded kext vtables and aligned containers of the macOS kexts)
# on the same iOS-platform kernel, memory layout and link address as iPadOS (scripts/build-xnu-4k-baseline.sh).
"target" = "macosx"
# The deployment version of that iOS-platform kernel (macOS-DroidVM's k27 builds with -miphoneos-version-min=26.0).
"ios_version" = "27.0"
"abi" = []
# Packaging stays macOS-DroidVM's for now: its k27 tooling links this kernel into a macOS kernel collection with the macOS
# kexts and the board's own kexts (overlay/kext), boots the single APFS container and supplies the device tree. So this
# profile has no [kernel.prelink], [adt] or [root] table yet: `unixnu build --os macos-27.0.1-26A434 kernel` builds the
# kernel, the collection is k27/kc-build27.py's.
# Opt-in bring-up diagnostics of that line: patches/xnu/diag.series (add "os:patches/xnu/diag.series" at the end of the
# board's macOS patch_series).


["ipsw"]
"url" = "https://updates.cdn-apple.com/2026FallFCS/59241290-5d51-4ca8-9df4-31624b9a4eac/UniversalMac_27.0.1_26A434_Restore.ipsw"
"product" = "VirtualMac2,1"
"version" = "27.0.1"
"build" = "26A434"
# The whole IPSW is 2f016638293c3e641b8b25391a76fbc16563b3711915a5551cf8aa0f5598a5c1 (sha256; [ipsw.sha256] would pin members).
# The virtual Mac's Erase identity (BuildManifest: vma2macosap, ApChipID 0xFE00, ApBoardID 0x20).
"device_class" = "vma2macosap"
"chip_id" = 65024
"board_id" = 32
"fetch" = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache", "Cryptex1,AppTrustCache"]


# Apple sources of the release that pairs with xnu-12377.121.6, the same pins as the iPadOS 27 profile (public source
